name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify mechanized Prism zero-drift & contracts
        run: npm run prism:drift

      - name: Run type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      # The same game, built as the page of the Prism holo (prism/view/): one
      # self-contained script and stylesheet the verified holospace can carry.
      # The Prism registry builds the holo from the committed prism/view/, so a
      # game change should be committed with `npm run build:view` run again.
      - name: Build the game as the holo's page
        run: |
          npm run build:view
          if ! git diff --quiet -- prism/view; then
            echo "::warning title=prism/view is stale::The committed holo page differs from this build of the game. Run npm run build:view and commit prism/view, so the Prism registry's source build carries the current game."
          fi

      - name: Check, build and verify the Prism holo
        working-directory: prism
        run: |
          npx --yes prism-code@0.11.5 build --json > "$RUNNER_TEMP/holo-build.json" || { cat "$RUNNER_TEMP/holo-build.json"; exit 1; }
          npx --yes prism-code@0.11.5 verify

      - name: Publish app.holo and app.json beside the game
        run: node scripts/publish-holo.mjs prism dist "$RUNNER_TEMP/holo-build.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
